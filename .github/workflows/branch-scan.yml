name: Scan All Branch Conflict Risks

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repository URL to scan"
        required: true
        default: "https://github.com/Gokul-K-19/gitmerge.git"

jobs:
  branch-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install scikit-learn joblib

      - name: Run branch pair scanner on target repo
        run: |
          python scan_all_branch_conflicts.py "${{ github.event.inputs.repo_url }}"

      - name: Show JSON output in logs
        run: |
          echo "===== branch_pair_results.json ====="
          cat branch_pair_results.json

      - name: Write GitHub Actions summary
        run: |
          echo "## 🌿 Branch Conflict Risk Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scanned Repo:** \`${{ github.event.inputs.repo_url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Branch 1 | Branch 2 | Risk | Probability | Potential Files |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|------|-------------|-----------------|" >> $GITHUB_STEP_SUMMARY

          python - << 'EOF'
          import json
          import os

          with open("branch_pair_results.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              for item in data[:20]:
                  b1 = item.get("branch1", "")
                  b2 = item.get("branch2", "")
                  risk = item.get("risk_label", "")
                  prob = item.get("probability", "")
                  files = ", ".join(item.get("overlap_files", [])) if item.get("overlap_files") else "None"
                  out.write(f"| {b1} | {b2} | {risk} | {prob} | {files} |\n")
          EOF

      - name: Upload branch scan results
        uses: actions/upload-artifact@v4
        with:
          name: branch-pair-results
          path: branch_pair_results.json
          if-no-files-found: error
