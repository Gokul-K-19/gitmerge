name: Scan All Branch Conflict Risks

on:
  workflow_dispatch:

jobs:
  branch-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (FULL history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches
        run: |
          git fetch origin +refs/heads/*:refs/remotes/origin/*

      - name: Debug branches
        run: git branch -a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install scikit-learn joblib

      - name: Run branch pair scanner
        run: |
          python scan_all_branch_conflicts.py .

      - name: Show results
        run: cat branch_pair_results.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: branch-pair-results
          path: branch_pair_results.json