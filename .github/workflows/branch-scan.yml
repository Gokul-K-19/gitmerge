name: Scan All Branch Conflict Risks

on:
  workflow_dispatch:

jobs:
  branch-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (FULL history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches
        run: |
          git fetch origin +refs/heads/*:refs/remotes/origin/*

      - name: Debug Git state
        run: |
          echo "===== CURRENT DIR ====="
          pwd
          echo "===== GIT STATUS ====="
          git status
          echo "===== LOCAL BRANCHES ====="
          git branch
          echo "===== ALL BRANCHES ====="
          git branch -a
          echo "===== REMOTES ====="
          git remote -v
          echo "===== HEAD ====="
          git rev-parse HEAD
          echo "===== SHOW REFS ====="
          git show-ref || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install scikit-learn joblib

      - name: Run branch pair scanner (with debug)
        run: |
          python scan_all_branch_conflicts.py . || true

      - name: Show branch pair results if exists
        run: |
          if [ -f branch_pair_results.json ]; then
            cat branch_pair_results.json
          else
            echo "branch_pair_results.json not created"
          fi

      - name: Upload results if exists
        uses: actions/upload-artifact@v4
        with:
          name: branch-pair-results
          path: branch_pair_results.json
          if-no-files-found: warn